# =====================================================================
# Architecture: Complete Self-Contained Vault Agent Sidecar Stack
# =====================================================================
# 1. vault: Runs an ephemeral HashiCorp Vault instance in dev mode (-dev).
# 2. vault-agent: Authenticates via AppRole, pulls secrets via API, and 
#    writes them to an in-memory/shared volume.
# 3. mysql-vaulted: Boots securely by reading credentials directly from app.env.
# 4. bankapp-vaulted: Spring Boot application consuming its datasource 
#    environment variables from the same shared volume.
# =====================================================================

version: '3.8'

services:
  # 1. Your Vault Server (running locally for your lab)
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroottoken"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - bankapp-vault-net

  # 2. Vault Agent Sidecar (Fetches secrets dynamically via API and writes to RAM)
  vault-agent:
    image: hashicorp/vault:latest
    container_name: vault-agent
    restart: unless-stopped
    depends_on:
      - vault
    volumes:
      - ./vault/config/vault-agent-config.hcl:/vault/config/vault-agent-config.hcl:ro
      - ./vault/templates/env.ctmpl:/vault/templates/env.ctmpl:ro
      - ./vault/approle-id/role-id:/vault/config/role-id:ro
      - ./vault/approle-id/secret-id:/vault/config/secret-id:ro
      - ./vault/secrets:/vault/secrets
    entrypoint: vault agent -config=/vault/config/vault-agent-config.hcl
    healthcheck:
      test: ["CMD-SHELL", "test -f /vault/secrets/app.env"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - bankapp-vault-net

  # 3. MySQL Database (Consumes secrets directly from the volume)
  mysql-vaulted:
    image: mysql:8.0
    container_name: mysql-vaulted
    restart: unless-stopped
    depends_on:
      vault-agent:
        condition: service_healthy
    env_file:
      - ./vault/secrets/app.env
    volumes:
      - ./mysql-vaulted-data:/var/lib/mysql
      - ./vault/secrets:/vault/secrets:ro
    networks:
      - bankapp-vault-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 4. Your Application (Consumes secrets directly from the volume)
  bankapp-vaulted:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubenix/bankapp-vaulted:v.1.0.0
    container_name: bankapp-vaulted
    restart: unless-stopped
    depends_on:
      mysql-vaulted:
        condition: service_healthy
    env_file:
      - ./vault/secrets/app.env
    volumes:
      - ./vault/secrets:/vault/secrets:ro
    ports:
      - "8083:8080"
    networks:
      - bankapp-vault-net

networks:
  bankapp-vault-net:

volumes:
  shared-secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
